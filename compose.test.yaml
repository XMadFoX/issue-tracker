services:
  pg_test:
    image: pgvector/pgvector:pg17
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: issue_tracker
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d issue_tracker"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 10s
